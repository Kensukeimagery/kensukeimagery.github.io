name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # สร้างเว็บใหม่อัตโนมัติ: 1 ม.ค. (ปีเปลี่ยน) และ 1 ก.พ. (อายุเปลี่ยน) เวลา 00:05 น. ไทย
  schedule:
    - cron: '5 17 31 12 *'
    - cron: '5 17 31 1 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
